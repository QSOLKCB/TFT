[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "qsol-tft"
version = "0.2.0"
description = "Alpha research prototype for reproducible tensor invariance and quadrature sonification experiments."
readme = "README.md"
requires-python = ">=3.10"
license = "CC-BY-4.0"
license-files = ["LICENSE"]
authors = [
  { name = "Trent Slade" },
]
keywords = [
  "tensor invariants",
  "quadrature",
  "scientific sonification",
  "reproducible research",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
  "numpy>=1.26",
]

[project.optional-dependencies]
demo = [
  "matplotlib>=3.8",
]
dev = [
  "pytest>=7.4",
]

[project.scripts]
tft = "tft.cli:main"

[project.urls]
Homepage = "https://github.com/QSOLKCB/TFT"
Repository = "https://github.com/QSOLKCB/TFT"
Issues = "https://github.com/QSOLKCB/TFT/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
