name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python }} / NumPy ${{ matrix.numpy }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.10"
            numpy: "1.26"
          - python: "3.10"
            numpy: "current"
          - python: "3.11"
            numpy: "current"
          - python: "3.12"
            numpy: "1.26"
          - python: "3.12"
            numpy: "current"
          - python: "3.13"
            numpy: "current"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip

      - name: Install TFT Lab with NumPy 1.26
        if: matrix.numpy == '1.26'
        run: python -m pip install -e ".[demo,dev]" "numpy>=1.26,<2"

      - name: Install TFT Lab with current NumPy
        if: matrix.numpy == 'current'
        run: python -m pip install --upgrade -e ".[demo,dev]" numpy

      - name: Check dependency consistency
        run: |
          python -m pip check

      - name: Run test suite
        run: python -m pytest

      - name: Smoke-test CLI and verify an artifact bundle
        env:
          MPLBACKEND: Agg
        run: |
          tft --help
          tft demo --plot --out "$RUNNER_TEMP/tft-smoke"
          tft verify "$RUNNER_TEMP/tft-smoke/manifest.json"

  package:
    name: Build package
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build source and wheel distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Install and inspect wheel
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python -m pip check
          tft --help
